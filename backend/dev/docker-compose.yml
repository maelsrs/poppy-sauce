services:
  mongo-dev:
    image: mongo:7
    container_name: mongo-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: poppy_sauce
    command: ["mongod", "--bind_ip_all", "--logpath", "/proc/1/fd/1", "--logappend", "--verbose"]
    volumes:
      - mongo_dev_data:/data/db

volumes:
  mongo_dev_data:
